[project]
name = "mathexp"
version = "0.1.0"
description = "Lemma-level weaving: an LLM loop that bounds small extremal-combinatorics problems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mathexp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
