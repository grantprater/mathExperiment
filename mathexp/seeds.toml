# Named seed problems. `known_as` lists accepted names for recognition scoring
# (matched case-insensitively, ignoring punctuation, as a substring either way).
# Family B seeds keep `p` present even for int/cyclic groups (it is ignored there)
# so that a group change is a one-field mutation.

[[seed]]
name = "oddtown"
family = "setfam"
known_as = ["Oddtown", "odd town", "Clubs of Oddtown"]
spec = { p = 2, size_mod = [1], int_mod = [0], ns = [3, 4, 5, 6, 7] }

[[seed]]
name = "eventown"
family = "setfam"
known_as = ["Eventown", "even town"]
spec = { p = 2, size_mod = [0], int_mod = [0], ns = [3, 4, 5, 6, 7] }

[[seed]]
name = "reverse_oddtown"
family = "setfam"
known_as = ["reverse Oddtown", "Oddtown", "Eventown"]
spec = { p = 2, size_mod = [0], int_mod = [1], ns = [3, 4, 5, 6, 7] }

