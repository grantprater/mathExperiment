# Lemmas: statements that hold in some field, with hypotheses and conclusion.
# `unsure = true` marks an entry whose precise statement the author is not certain of.
# Composite theorems that would solve family A outright (Frankl–Wilson, Ray-Chaudhuri–Wilson,
# Deza–Frankl–Singhi) are deliberately NOT on the menu: the loop is meant to weave them.

[[lemma]]
id = "dim_independent"
name = "Independent vectors are at most the dimension"
hypotheses = "v_1, ..., v_m are linearly independent vectors in a vector space of dimension d over a field."
conclusion = "m <= d."

[[lemma]]
id = "gram_rank"
name = "Gram / rank inequality"
hypotheses = "M is an m x n matrix over a field K and G = M M^T."
conclusion = "rank G <= rank M <= min(m, n). In particular, if G is non-singular then m <= n."

[[lemma]]
id = "triangular_nonsingular"
name = "Triangular matrices with non-zero diagonal are non-singular"
hypotheses = "An m x m matrix over a field has non-zero diagonal entries and zeros on one side of the diagonal (after some ordering of rows and columns)."
conclusion = "It has rank m."

[[lemma]]
id = "multilinear_dim"
name = "Dimension of multilinear polynomials of degree at most s"
hypotheses = "n variables, any field, integer s >= 0."
conclusion = "The space of multilinear polynomials of degree <= s has dimension sum_{i=0}^{s} C(n, i) = binom_sum(n, s)."

[[lemma]]
id = "diagonal_criterion"
name = "Diagonal criterion for independence of functions"
hypotheses = "f_1, ..., f_m are functions from a set Omega to a field, and v_1, ..., v_m are points of Omega with f_i(v_i) != 0 for all i and f_i(v_j) = 0 whenever j < i (in particular whenever j != i)."
conclusion = "f_1, ..., f_m are linearly independent, so m is at most the dimension of any space of functions containing them."

[[lemma]]
id = "self_orthogonal"
name = "Self-orthogonal subspaces have at most half the dimension"
hypotheses = "W is a subspace of F_p^n with u . w = 0 for all u, w in W (standard dot product)."
conclusion = "dim W <= floor(n / 2), so |W| <= p^floor(n/2)."

[[lemma]]
id = "cauchy_schwarz"
name = "Cauchy–Schwarz"
hypotheses = "Real numbers a_1..a_N and b_1..b_N."
conclusion = "(sum a_i b_i)^2 <= (sum a_i^2)(sum b_i^2); in particular sum d_i^2 >= (sum d_i)^2 / N."

[[lemma]]
id = "pigeonhole"
name = "Pigeonhole / partition bound"
hypotheses = "The ground set is partitioned into m blocks and a valid set contains at most t elements of each block."
conclusion = "Every valid set has at most t m elements. (Equivalently: more than t m objects in m boxes force a box with more than t.)"

[[lemma]]
id = "expectation_alteration"
name = "Linearity of expectation with alteration"
hypotheses = "A random object with random variables X (size) and Y (number of bad configurations), where deleting one element per bad configuration removes all of them."
conclusion = "Some outcome gives a valid object of size >= E[X] - E[Y]. This is a LOWER bound on f."

[[lemma]]
id = "hoffman"
name = "Hoffman ratio bound"
hypotheses = "G is a d-regular graph on N vertices with smallest adjacency eigenvalue lambda_min (< 0)."
conclusion = "alpha(G) <= N (-lambda_min) / (d - lambda_min)."

[[lemma]]
id = "parseval"
name = "Parseval"
hypotheses = "f: G -> C on a finite abelian group G, with hat{f}(chi) = E_x f(x) conj(chi(x))."
conclusion = "sum_chi |hat{f}(chi)|^2 = E_x |f(x)|^2; for f = 1_A this is |A| / |G|."

[[lemma]]
id = "slice_rank_diagonal"
name = "Slice rank of a diagonal tensor"
hypotheses = "T: A x A x A -> F is diagonal (T(x,y,z) = 0 unless x = y = z) with every diagonal entry non-zero."
conclusion = "The slice rank of T equals |A|."

[[lemma]]
id = "slice_rank_capset"
name = "Slice rank of x + y + z = 0 over F_q^n (monomial count)"
hypotheses = "q is a prime power and T(x, y, z) = [x + y + z = 0] on (F_q^n)^3."
conclusion = "slice rank T <= 3 M, where M is the number of monomials x_1^{a_1}...x_n^{a_n} with 0 <= a_i <= q - 1 and a_1 + ... + a_n <= n (q - 1) / 3. For q = 3, M = sum over (i, j) with i + 2j <= 2n/3 of n! / (i! j! (n - i - j)!)."

[[lemma]]
id = "slice_rank_general_equation"
name = "Slice-rank bound for a x + b y + c z = 0 with a + b + c = 0"
hypotheses = "p is an odd prime, a, b, c are non-zero in F_p with a + b + c = 0, and A in F_p^n has no solution to a x + b y + c z = 0 other than x = y = z."
conclusion = "|A| <= 3 M with M the monomial count of slice_rank_capset (q = p)."
unsure = true

[[lemma]]
id = "disjoint_translates"
name = "Disjoint translates"
hypotheses = "A is a subset of a finite abelian group G and A ∩ (A + a) = ∅ for some a in G."
conclusion = "|A| <= |G| / 2."

[[lemma]]
id = "sidon_counting"
name = "Sidon counting"
hypotheses = "A in {1, ..., N} has all sums a + b (a <= b, a, b in A) distinct."
conclusion = "The positive differences a - b are distinct, so |A| (|A| - 1) / 2 <= N - 1; the sums give |A| (|A| + 1) / 2 <= 2N - 1."

[[lemma]]
id = "fisher"
name = "Fisher's inequality (non-uniform)"
hypotheses = "A_1, ..., A_m are distinct subsets of [n] and |A_i ∩ A_j| = lambda for all i != j, with lambda >= 1."
conclusion = "m <= n."

[[lemma]]
id = "ekr"
name = "Erdős–Ko–Rado"
hypotheses = "n >= 2k and F is a family of k-subsets of [n] with every two members intersecting."
conclusion = "|F| <= C(n - 1, k - 1)."

[[lemma]]
id = "lovasz_theta"
name = "Lovász theta bound"
hypotheses = "G is a graph on N vertices; theta(G) is its Lovász number."
conclusion = "alpha(G) <= theta(G) <= chi(complement of G). For a vertex-transitive G, theta(G) theta(complement G) = N; for a d-regular G, theta(G) <= N (-lambda_min) / (d - lambda_min)."
